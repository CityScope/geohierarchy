[project]
name = "geohierarchy"
version = "1.0.0"
description = "A high-performance hierarchical geospatial data management library using Polars and GeoPandas, inspired by h3-toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "polars>=1.0.0",
    "geopandas>=0.14.0",
    "h3ronpy>=0.18.0",
    "pyarrow>=15.0.0",
    "rasterio>=1.3.0",
    "fiona>=1.9.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.3.3",
    "folium>=0.16.0",
    "branca>=0.7.0",
    "mercantile>=1.2.1",
    "mapbox-vector-tile>=2.0.1",
    "scipy>=1.11.0",
    "h3>=4.0.0",
    "pyproj>=3.5.0",
    "freestiler>=0.2.0",
    "pmtiles>=3.7.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.8.0",   # geohierarchy.maps.general_map
    "pycountry>=24.6.1",   # geohierarchy.geocoding
    "requests>=2.31.0",    # geohierarchy.geocoding
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "nbconvert>=7.16.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# GPU is OPTIONAL: nothing here is installed by default and every code path falls back to the CPU when CuPy / a CUDA device is missing (TRANSITLOS_DEVICE=cpu forces it).
gpu = ["cupy-cuda12x>=13.0"]
# RAPIDS (cuDF / cuGraph) is big and pins its own dependency versions: install it in a SEPARATE environment, e.g.
#   python -m venv .venv-rapids && .venv-rapids/bin/pip install cudf-cu12 cugraph-cu12 --extra-index-url=https://pypi.nvidia.com
# and point TRANSITLOS_RAPIDS_PYTHON at that environment's python; the pipeline calls it in a subprocess only when it exists.
rapids = ["cudf-cu12", "cugraph-cu12"]
